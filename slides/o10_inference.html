<section data-label="10 Inference Animation" class="bg-ink">
  <div class="slide-frame" style="padding: 60px 80px 80px;">
    <div class="eyebrow build" data-step="0">Inferencja w modelu generatywnym</div>
    <h2 class="section-title build" data-step="0" style="margin-top: 20px; font-size: 52px;">
      Krok po kroku — <span class="grad-text-warm">jak model generuje tekst</span>
    </h2>

    <!-- Animation container — fixed layout, buttons anchored at bottom -->
    <div id="inference-anim" style="margin-top: 28px; flex: 1; display: flex; flex-direction: column; gap: 18px; min-height: 0;">

      <!-- Generated sequence display -->
      <div style="display: flex; align-items: center; gap: 16px; flex-shrink: 0;">
        <div class="tiny" style="color: rgba(255,255,255,0.4); letter-spacing: 0.1em; width: 160px; flex-shrink: 0;">SEKWENCJA:</div>
        <div id="seq-display" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; min-height: 70px;"></div>
      </div>

      <!-- Current step info — grows to fill available space -->
      <div style="display: flex; gap: 24px; align-items: stretch; flex: 1; min-height: 0;">
        <!-- Left: model box -->
        <div style="flex: 0 0 300px;">
          <div id="model-box" style="background: rgba(58,28,125,0.4); border: 2px solid rgba(86,45,127,0.7); border-radius: 20px; padding: 24px; text-align: center; height: 100%; display: flex; flex-direction: column; justify-content: center;">
            <div class="tiny" style="color: rgba(255,255,255,0.4); margin-bottom: 10px;">MODEL RNN/GRU</div>
            <div style="font-size: 48px; margin: 8px 0;">🧠</div>
            <div id="model-thinking" style="font-size: 22px; color: rgba(255,255,255,0.5); min-height: 28px;">czeka…</div>
          </div>
        </div>

        <!-- Middle: probability distribution — fixed height bars -->
        <div style="flex: 1;">
          <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 16px 28px 14px; height: 100%; display: flex; flex-direction: column;">
            <div class="tiny" style="color: rgba(255,255,255,0.4); margin-bottom: 10px; letter-spacing: 0.1em; flex-shrink: 0;">ROZKŁAD PRAWDOPODOBIEŃSTWA P(następna litera | kontekst)</div>
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end;">
              <div id="prob-bars" style="display: flex; gap: 10px; align-items: flex-end; flex: 1; min-height: 0;"></div>
              <div id="prob-labels" style="display: flex; gap: 10px; margin-top: 8px; flex-shrink: 0;"></div>
            </div>
          </div>
        </div>

        <!-- Right: chosen token -->
        <div style="flex: 0 0 220px;">
          <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; text-align: center; height: 100%; display: flex; flex-direction: column; justify-content: center;">
            <div class="tiny" style="color: rgba(255,255,255,0.4); margin-bottom: 10px;">WYBRANY TOKEN</div>
            <div id="chosen-token" style="font-family: 'JetBrains Mono', monospace; font-size: 72px; font-weight: 700; color: var(--accent); line-height: 1; margin: 8px 0;">?</div>
            <div id="chosen-prob" style="font-size: 22px; color: rgba(255,255,255,0.4);"></div>
            <div id="chosen-method" style="font-size: 18px; margin-top: 6px; font-weight: 600;"></div>
          </div>
        </div>
      </div>

      <!-- Step controls and description — anchored, fixed height -->
      <div style="display: flex; align-items: flex-start; gap: 24px; flex-shrink: 0; height: 128px;">
        <div style="display: flex; gap: 12px; flex-shrink: 0;">
          <button id="btn-restart" onclick="inferenceRestart()" style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px 24px; border-radius: 12px; font-size: 20px; cursor: pointer; font-family: Inter, sans-serif; font-weight: 600; transition: background 0.2s;">↺ Reset</button>
          <button id="btn-back" onclick="inferenceBack()" style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px 24px; border-radius: 12px; font-size: 20px; cursor: pointer; font-family: Inter, sans-serif; font-weight: 600; transition: background 0.2s;">← Wstecz</button>
          <button id="btn-step" onclick="inferenceStep()" style="background: linear-gradient(135deg, rgba(255,175,123,0.3), rgba(215,109,119,0.3)); border: 1px solid rgba(255,175,123,0.5); color: white; padding: 12px 32px; border-radius: 12px; font-size: 20px; cursor: pointer; font-family: Inter, sans-serif; font-weight: 700; transition: background 0.2s;">Następny krok →</button>
          <button id="btn-auto" onclick="inferenceAuto()" style="background: rgba(0,188,222,0.15); border: 1px solid rgba(0,188,222,0.4); color: var(--accent-2); padding: 12px 24px; border-radius: 12px; font-size: 20px; cursor: pointer; font-family: Inter, sans-serif; font-weight: 600; transition: background 0.2s;">▶ Auto</button>
        </div>
        <div id="step-desc" class="body-sm" style="color: rgba(255,255,255,0.6); flex: 1; line-height: 1.4; height: 128px; overflow: hidden; display: flex; align-items: center;">Kliknij „Następny krok", aby zobaczyć, jak model generuje nazwę choroby znak po znaku.</div>
      </div>
    </div>
  </div>
  <div class="page-num">10</div>
</section>
