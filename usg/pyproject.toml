[project]
name = "usg-masa-plodu"
version = "0.1.0"
description = "USG płodu → masa: środowisko i notebook pokazowy (sympozjum pediatryczne)"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "nnunetv2==2.2.1",
    "numpy<2",
    "SimpleITK>=2.3",
    "opencv-python-headless>=4.8",
    "einops>=0.7",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "ipywidgets>=8",
    "notebook>=7",
    "remotezip>=0.12",
    "requests>=2.31",
    "gradio==6.31.0",
]

[dependency-groups]
dev = ["pytest>=8", "nbconvert>=7", "nbformat>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usg_masa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "siec: wymaga internetu (GitHub/Zenodo)",
    "wolny: trwa dłużej niż 30 s (model na prawdziwych danych)",
]
