[project]
name = "delphi-demo"
version = "0.1.0"
description = "Delphi-2M: środowisko i notebook pokazowy (sympozjum pediatryczne)"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.3.0",
    "numpy<2",
    "pandas>=2.2,<3",
    "matplotlib>=3.8",
    "ipywidgets>=8",
    "notebook>=7",
]

[dependency-groups]
dev = ["pytest>=8", "nbconvert>=7", "nbformat>=5", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delphi_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "siec: wymaga internetu (GitHub)",
    "wolny: trwa dłużej niż 30 s (trening, wytrenowany model, notebook)",
]
